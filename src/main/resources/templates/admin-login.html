<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xác Thực Quản Trị - Nhà Nghỉ Trung Hiếu</title>
    
    <!-- Favicon & Google Fonts -->
    <link rel="icon" type="image/svg+xml" href="/images/logo-bavi.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --font-main: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            --bg-primary: #F8F7F4;
            --bg-surface: #FFFFFF;
            --text-main: #1C1917;
            --text-muted: #57534E;
            --text-light: #78716C;
            --accent-wood: #A36B42;
            --accent-wood-hover: #8B562F;
            --border: rgba(28, 25, 23, 0.1);
            --danger-bg: #FEE2E2;
            --danger-text: #B91C1C;
            --radius-md: 12px;
            --radius-lg: 18px;
            --shadow-card: 0 10px 30px -5px rgba(28, 25, 23, 0.08), 0 4px 10px -3px rgba(28, 25, 23, 0.04);
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-main);
            background-color: var(--bg-primary);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .login-card {
            background-color: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-card);
            width: 100%;
            max-width: 440px;
            padding: 40px 32px;
            text-align: center;
        }

        .brand-icon {
            width: 56px;
            height: 56px;
            background-color: #F0ECE1;
            color: var(--accent-wood);
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
        }

        .title {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 6px;
        }

        .subtitle {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 28px;
            line-height: 1.4;
        }

        .alert-error {
            background-color: var(--danger-bg);
            color: var(--danger-text);
            padding: 12px 16px;
            border-radius: var(--radius-md);
            font-size: 0.88rem;
            font-weight: 500;
            margin-bottom: 24px;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-group {
            text-align: left;
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-size: 0.88rem;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-main);
        }

        .input-wrap {
            position: relative;
        }

        .form-input {
            width: 100%;
            height: 52px;
            padding: 0 46px 0 16px;
            font-size: 1.05rem;
            font-family: inherit;
            border: 1.5px solid var(--border);
            border-radius: var(--radius-md);
            background-color: #FAF9F6;
            transition: all 0.2s ease;
            letter-spacing: 0.05em;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--accent-wood);
            background-color: #FFFFFF;
            box-shadow: 0 0 0 4px rgba(163, 107, 66, 0.12);
        }

        .toggle-btn {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-light);
            cursor: pointer;
            padding: 4px;
        }

        .remember-wrap {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 24px;
            cursor: pointer;
            user-select: none;
        }

        .remember-wrap input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: var(--accent-wood);
            cursor: pointer;
        }

        .remember-wrap span {
            font-size: 0.88rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        .btn-submit {
            width: 100%;
            height: 52px;
            background-color: var(--accent-wood);
            color: #FFFFFF;
            border: none;
            border-radius: var(--radius-md);
            font-size: 1rem;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-submit:hover {
            background-color: var(--accent-wood-hover);
            transform: translateY(-1px);
        }

        .security-note {
            margin-top: 24px;
            padding-top: 18px;
            border-top: 1px dashed var(--border);
            font-size: 0.82rem;
            color: var(--text-light);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .back-link {
            display: inline-block;
            margin-top: 20px;
            font-size: 0.88rem;
            color: var(--text-muted);
            text-decoration: none;
            transition: color 0.2s;
        }

        .back-link:hover {
            color: var(--accent-wood);
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="brand-icon" style="width: 64px; height: 64px; padding: 6px; background: #FAF7F2; border: 1.5px solid rgba(163, 107, 66, 0.25); border-radius: 16px;">
            <img src="/images/logo-bavi.svg" alt="Núi Ba Vì" width="48" height="48" style="width: 100%; height: 100%; object-fit: contain;">
        </div>

        <h1 class="title">Khu Vực Quản Lý</h1>
        <p class="subtitle" th:text="${motelName} + ' • Sơn Tây'">Nhà Nghỉ Trung Hiếu • Sơn Tây</p>

        <div th:if="${errorMessage != null}" class="alert-error">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
            <span th:text="${errorMessage}">Mã PIN hoặc mật khẩu không chính xác!</span>
        </div>

        <form action="/admin/login" method="post" id="loginForm">
            <div class="form-group">
                <label for="pinInput" class="form-label">Mã PIN hoặc Mật khẩu Quản lý</label>
                <div class="input-wrap">
                    <input type="password" id="pinInput" name="pin" class="form-input" placeholder="Nhập mã PIN hoặc mật khẩu..." required autofocus autocomplete="current-password">
                    <button type="button" class="toggle-btn" id="togglePinBtn" title="Hiện/Ẩn">
                        <svg id="eyeIcon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                    </button>
                </div>
            </div>

            <label class="remember-wrap">
                <input type="checkbox" name="rememberMe" value="true" checked>
                <span>Ghi nhớ đăng nhập trên thiết bị này (30 ngày)</span>
            </label>

            <button type="submit" class="btn-submit">
                <span>Vào Hệ Thống Quản Lý</span>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
            </button>
        </form>

        <div class="security-note">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
            <span>Khu vực quản lý nội bộ dành riêng cho chủ nhà nghỉ & lễ tân.</span>
        </div>

        <a href="/" class="back-link">← Quay lại trang chủ xem phòng</a>
    </div>

    <script>
        const pinInput = document.getElementById('pinInput');
        const togglePinBtn = document.getElementById('togglePinBtn');
        let isVisible = false;

        togglePinBtn.addEventListener('click', () => {
            isVisible = !isVisible;
            pinInput.type = isVisible ? 'text' : 'password';
            togglePinBtn.innerHTML = isVisible
                ? '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>'
                : '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>';
        });
    </script>
</body>
</html>
